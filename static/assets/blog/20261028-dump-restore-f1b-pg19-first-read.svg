<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 318" width="760" height="318" role="img" aria-labelledby="t d">
<title id="t">Postgres 19rc1: the first read after pg_restore pays for the visibility map</title>
<desc id="d">Cold-cache execution time of one join query over a 250 M-row table, linear scale from 0 s. Each bar is the median of the runs in its row, each dot is one run. pg_restore only, first run: 110 to 113 s, sets visibility-map bits; WAL estimate about 31 GiB; pg_restore only, later runs: median 29.5 s, Seq Scan, Hash Join; + ANALYZE: median 23 ms, Index Only Scan, 0 heap fetches. The first-run WAL is estimated from checkpoint distances in the server log, not from EXPLAIN; first run: one cold-cache run after each of 3 pg_restore runs; later runs: the other 6 runs; + ANALYZE: 9 runs.</desc>
<style>
  .bg{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.grid{stroke:#e4e3df}.axis{stroke:#9a9993}
  .s1{fill:#2a78d6}.s2{fill:#eb6834}.band{fill:#eb6834;opacity:.08}.gap{stroke:#fcfcfb}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
</style>
<rect class="bg" width="760" height="318" rx="8"/>
<text class="t1" x="24" y="30" font-size="15" font-weight="600">Postgres 19rc1: the first read after pg_restore pays for the visibility map</text>
<text class="t2" x="24" y="50" font-size="12">Bar: median of the runs in the row. Dot: one cold-cache run.</text>
<line class="grid" x1="300.0" x2="300.0" y1="64" y2="218" stroke-width="1"/>
<text class="t2" x="300.0" y="234" font-size="11" text-anchor="middle">0 s</text>
<line class="grid" x1="365.0" x2="365.0" y1="64" y2="218" stroke-width="1"/>
<text class="t2" x="365.0" y="234" font-size="11" text-anchor="middle">20 s</text>
<line class="grid" x1="430.0" x2="430.0" y1="64" y2="218" stroke-width="1"/>
<text class="t2" x="430.0" y="234" font-size="11" text-anchor="middle">40 s</text>
<line class="grid" x1="495.0" x2="495.0" y1="64" y2="218" stroke-width="1"/>
<text class="t2" x="495.0" y="234" font-size="11" text-anchor="middle">60 s</text>
<line class="grid" x1="560.0" x2="560.0" y1="64" y2="218" stroke-width="1"/>
<text class="t2" x="560.0" y="234" font-size="11" text-anchor="middle">80 s</text>
<line class="grid" x1="625.0" x2="625.0" y1="64" y2="218" stroke-width="1"/>
<text class="t2" x="625.0" y="234" font-size="11" text-anchor="middle">100 s</text>
<line class="grid" x1="690.0" x2="690.0" y1="64" y2="218" stroke-width="1"/>
<text class="t2" x="690.0" y="234" font-size="11" text-anchor="middle">120 s</text>
<line class="axis" x1="300" x2="690" y1="218" y2="218" stroke-width="1"/>
<line class="axis" x1="300" x2="300" y1="64" y2="218" stroke-width="1"/>
<text class="t2" x="495.0" y="252" font-size="11" text-anchor="middle">Execution time with a cold cache, seconds (linear scale, starts at 0)</text>
<text class="t1" x="24" y="87.0" font-size="13">pg_restore only, first run</text>
<text class="t2" x="24" y="103.0" font-size="11">sets visibility-map bits; WAL estimate about 31 GiB</text>
<rect class="s2" x="300.0" y="77.0" width="364.75" height="22" fill-opacity=".28"/>
<circle class="s2" cx="659.2" cy="82.0" r="3" fill-opacity=".85"/>
<circle class="s2" cx="664.1" cy="88.0" r="3" fill-opacity=".85"/>
<circle class="s2" cx="665.8" cy="94.0" r="3" fill-opacity=".85"/>
<text class="t1" x="676.5" y="93.0" font-size="14" font-weight="600">110 to 113 s</text>
<text class="t1" x="24" y="135.0" font-size="13">pg_restore only, later runs</text>
<text class="t2" x="24" y="151.0" font-size="11">Seq Scan, Hash Join</text>
<rect class="s1" x="300.0" y="125.0" width="95.94" height="22" fill-opacity=".28"/>
<circle class="s1" cx="395.3" cy="130.0" r="3" fill-opacity=".85"/>
<circle class="s1" cx="403.9" cy="130.0" r="3" fill-opacity=".85"/>
<circle class="s1" cx="395.6" cy="136.0" r="3" fill-opacity=".85"/>
<circle class="s1" cx="395.8" cy="136.0" r="3" fill-opacity=".85"/>
<circle class="s1" cx="396.2" cy="142.0" r="3" fill-opacity=".85"/>
<circle class="s1" cx="395.9" cy="142.0" r="3" fill-opacity=".85"/>
<text class="t1" x="414.0" y="141.0" font-size="14" font-weight="600">29.5 s</text>
<text class="t1" x="24" y="183.0" font-size="13">+ ANALYZE</text>
<text class="t2" x="24" y="199.0" font-size="11">Index Only Scan, 0 heap fetches</text>
<rect class="s1" x="300.0" y="173.0" width="0.07" height="22" fill-opacity=".28"/>
<circle class="s1" cx="300.1" cy="178.0" r="3" fill-opacity=".85"/>
<circle class="s1" cx="300.1" cy="178.0" r="3" fill-opacity=".85"/>
<circle class="s1" cx="300.1" cy="178.0" r="3" fill-opacity=".85"/>
<circle class="s1" cx="300.1" cy="184.0" r="3" fill-opacity=".85"/>
<circle class="s1" cx="300.1" cy="184.0" r="3" fill-opacity=".85"/>
<circle class="s1" cx="300.1" cy="184.0" r="3" fill-opacity=".85"/>
<circle class="s1" cx="300.1" cy="190.0" r="3" fill-opacity=".85"/>
<circle class="s1" cx="300.1" cy="190.0" r="3" fill-opacity=".85"/>
<circle class="s1" cx="300.1" cy="190.0" r="3" fill-opacity=".85"/>
<text class="t1" x="310.1" y="189.0" font-size="14" font-weight="600">23 ms</text>
<text class="t2" x="24" y="280" font-size="12">First run: one cold-cache run after each of 3 pg_restore runs. Later runs: the other 6 runs. + ANALYZE: 9 runs.</text>
<text class="t2" x="24" y="298" font-size="12">WAL estimated from checkpoint distances in the server log, not from EXPLAIN.</text>
</svg>
