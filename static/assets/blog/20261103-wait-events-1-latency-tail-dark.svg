<text class="t1" x="724" y="246.0" font-size="12" text-anchor="end">baseline, A and B:</text>
<text class="t1" x="724" y="260.0" font-size="12" text-anchor="end">p99.9 ≈ 11 ms</text>
<text class="t1" x="431.2" y="294.0" font-size="12" text-anchor="end">C: 5.8 ms</text>
<rect class="s1" x="86" y="283" width="16" height="4"/><text class="t1" x="110" y="288" font-size="12">baseline</text>
<rect class="s2" x="86" y="300" width="16" height="4"/><text class="t1" x="110" y="305" font-size="12">fix A: synchronous_commit = off</text>
<rect class="s4" x="86" y="317" width="16" height="4"/><text class="t1" x="110" y="322" font-size="12">fix B: 2 GB cache, no disk reads</text>
<rect class="s3" x="86" y="334" width="16" height="4"/><text class="t1" x="110" y="339" font-size="12">fix C: background job in 5-row chunks</text>
<text class="t2" x="70" y="396" font-size="11">Runs R0c, F1a, F1b, F2: 2,000 requests/s, 120 s each, about 240,000 requests per run.</text>
<text class="t2" x="70" y="411" font-size="11">Fixes A and B move the bulk of requests and leave the tail; fix C moves only the tail.</text>
</svg>