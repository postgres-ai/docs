<text class="t2" x="62" y="56.0" font-size="12" text-anchor="end">100%</text>
<line class="grid" x1="70" x2="730" y1="124.0" y2="124.0" stroke-width="1"/>
<text class="t2" x="62" y="128.0" font-size="12" text-anchor="end">10%</text>
<line class="grid" x1="70" x2="730" y1="196.0" y2="196.0" stroke-width="1"/>
<text class="t2" x="62" y="200.0" font-size="12" text-anchor="end">1%</text>
<line class="grid" x1="70" x2="730" y1="268.0" y2="268.0" stroke-width="1"/>
<text class="t2" x="62" y="272.0" font-size="12" text-anchor="end">0.1%</text>
<line class="grid" x1="70" x2="730" y1="340.0" y2="340.0" stroke-width="1"/>
<text class="t2" x="62" y="344.0" font-size="12" text-anchor="end">0.01%</text>
<line class="grid" x1="70.0" x2="70.0" y1="52" y2="340" stroke-width="1"/>
<text class="t2" x="70.0" y="358" font-size="12" text-anchor="middle">0.5 ms</text>
<line class="grid" x1="174.4" x2="174.4" y1="52" y2="340" stroke-width="1"/>
<text class="t2" x="174.4" y="358" font-size="12" text-anchor="middle">1 ms</text>
<line class="grid" x1="278.8" x2="278.8" y1="52" y2="340" stroke-width="1"/>
<text class="t2" x="278.8" y="358" font-size="12" text-anchor="middle">2 ms</text>
<line class="grid" x1="416.8" x2="416.8" y1="52" y2="340" stroke-width="1"/>
<text class="t2" x="416.8" y="358" font-size="12" text-anchor="middle">5 ms</text>
<line class="grid" x1="521.2" x2="521.2" y1="52" y2="340" stroke-width="1"/>
<text class="t2" x="521.2" y="358" font-size="12" text-anchor="middle">10 ms</text>
<line class="grid" x1="625.6" x2="625.6" y1="52" y2="340" stroke-width="1"/>
<text class="t2" x="625.6" y="358" font-size="12" text-anchor="middle">20 ms</text>
<line class="grid" x1="730.0" x2="730.0" y1="52" y2="340" stroke-width="1"/>
<text class="t2" x="730.0" y="358" font-size="12" text-anchor="middle">40 ms</text>
<text class="t2" x="400.0" y="380" font-size="12" text-anchor="middle">request latency, measured from its scheduled start (log scale)</text>
<text class="t2" x="76" y="263.0" font-size="12">p99.9: 1 request in 1,000 is slower than this</text>
