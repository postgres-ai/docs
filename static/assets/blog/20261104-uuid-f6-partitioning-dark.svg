<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img" aria-labelledby="t d">
<title id="t">Point lookups by id, 100 partitions: partition by what you look up by</title>
<desc id="d">Run 1x, 50M rows, 100 partitions, 16 clients, 8 vCPUs, literal id lookups per second: UUIDv4 partitioned by RANGE on created_at 2,614; UUIDv7 partitioned by RANGE on uuid_extract_timestamp(id) 2,863; UUIDv7 partitioned by RANGE on id 41,136; int8 partitioned by RANGE on id 41,008.</desc>
<style>
  .bg{fill:#202124}.t1{fill:#ececea}.t2{fill:#a8a7a1}.grid{stroke:#34363b}.axis{stroke:#6d6c68}.mark{stroke:#85847e}
  .f-v4{fill:#e5683d}.s-v4{stroke:#e5683d}
  .f-v7{fill:#3987e5}.s-v7{stroke:#3987e5}
  .f-int8{fill:#b85ab4}.s-int8{stroke:#b85ab4}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
</style>
<rect class="bg" width="760" height="250" rx="8"/>
<line class="grid" x1="300.0" x2="300.0" y1="28.0" y2="200.0" stroke-width="1"/>
<text class="t2" x="300.0" y="216.0" font-size="11" text-anchor="middle">0</text>
<line class="grid" x1="375.6" x2="375.6" y1="28.0" y2="200.0" stroke-width="1"/>
<text class="t2" x="375.6" y="216.0" font-size="11" text-anchor="middle">10k</text>
<line class="grid" x1="451.1" x2="451.1" y1="28.0" y2="200.0" stroke-width="1"/>
<text class="t2" x="451.1" y="216.0" font-size="11" text-anchor="middle">20k</text>
<line class="grid" x1="526.7" x2="526.7" y1="28.0" y2="200.0" stroke-width="1"/>
<text class="t2" x="526.7" y="216.0" font-size="11" text-anchor="middle">30k</text>
<line class="grid" x1="602.2" x2="602.2" y1="28.0" y2="200.0" stroke-width="1"/>
<text class="t2" x="602.2" y="216.0" font-size="11" text-anchor="middle">40k</text>
<text class="t2" x="640.0" y="232.0" font-size="11" text-anchor="end">lookups/s</text>
<line class="axis" x1="300.0" x2="300.0" y1="28.0" y2="200.0" stroke-width="1"/>
<text class="t1" x="288.0" y="51.0" font-size="12" text-anchor="end">UUIDv4, RANGE on created_at</text>
<rect class="f-v4" x="300.0" y="34.0" width="19.8" height="26.0" rx="2"/>
<text class="t1" x="327.8" y="46.0" font-size="12">2,614</text>
<text class="t2" x="327.8" y="60.0" font-size="11">scans every partition</text>
<text class="t1" x="288.0" y="95.0" font-size="12" text-anchor="end">UUIDv7, RANGE on timestamp of id</text>
<rect class="f-v7" x="300.0" y="78.0" width="21.6" height="26.0" rx="2"/>
<text class="t1" x="329.6" y="90.0" font-size="12">2,863</text>
<text class="t2" x="329.6" y="104.0" font-size="11">scans every partition</text>
<text class="t1" x="288.0" y="139.0" font-size="12" text-anchor="end">UUIDv7, RANGE on id</text>
<rect class="f-v7" x="300.0" y="122.0" width="310.8" height="26.0" rx="2"/>
<text class="t1" x="618.8" y="134.0" font-size="12">41,136</text>
<text class="t2" x="618.8" y="148.0" font-size="11">prunes to one</text>
<text class="t1" x="288.0" y="183.0" font-size="12" text-anchor="end">int8, RANGE on id</text>
<rect class="f-int8" x="300.0" y="166.0" width="309.8" height="26.0" rx="2"/>
<text class="t1" x="617.8" y="178.0" font-size="12">41,008</text>
<text class="t2" x="617.8" y="192.0" font-size="11">prunes to one</text>
</svg>
