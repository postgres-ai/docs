<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="760" height="410" role="img" aria-labelledby="t d">
<title id="t">Seconds from pg_restore exit until all three tables were vacuumed and analyzed</title>
<desc id="d">Postgres 18.6 default archive: 67 s, 9 s, 7 s; Postgres 18.6 --statistics: 35 s, 9 s, 6 s; Postgres 19rc1 default archive: 58 s, 8 s, 8 s; Postgres 19rc1 --statistics: 23 s, 10 s, 6 s (restores 1, 2, 3).</desc>
<style>
  .bg{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.grid{stroke:#e4e3df}.axis{stroke:#9a9993}
  .s1{fill:#2a78d6}.s2{fill:#eb6834}.band{fill:#eb6834;opacity:.08}.gap{stroke:#fcfcfb}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
</style>
<rect class="bg" width="760" height="410" rx="8"/>
<text class="t1" x="40.0" y="34.0" font-size="15" font-weight="600">Seconds from pg_restore exit until all three tables were vacuumed and analyzed</text>
<text class="t2" x="40.0" y="56.0" font-size="13">One point per fresh pg_restore; the short bar on the left marks the median</text>
<line class="grid" x1="84.0" x2="700.0" y1="314.0" y2="314.0" stroke-width="1"/>
<text class="t2" x="78.0" y="318.0" font-size="11" text-anchor="end">0</text>
<line class="grid" x1="84.0" x2="700.0" y1="258.5" y2="258.5" stroke-width="1"/>
<text class="t2" x="78.0" y="262.5" font-size="11" text-anchor="end">20</text>
<line class="grid" x1="84.0" x2="700.0" y1="203.0" y2="203.0" stroke-width="1"/>
<text class="t2" x="78.0" y="207.0" font-size="11" text-anchor="end">40</text>
<line class="grid" x1="84.0" x2="700.0" y1="147.5" y2="147.5" stroke-width="1"/>
<text class="t2" x="78.0" y="151.5" font-size="11" text-anchor="end">60</text>
<line class="grid" x1="84.0" x2="700.0" y1="92.0" y2="92.0" stroke-width="1"/>
<text class="t2" x="78.0" y="96.0" font-size="11" text-anchor="end">80</text>
<text class="t2" x="700.0" y="141.5" font-size="11" text-anchor="end">autovacuum_naptime, 60 s</text>
<line class="axis" x1="84.0" x2="700.0" y1="314.0" y2="314.0" stroke-width="1"/>
<text class="t2" x="40.0" y="203.0" font-size="11" text-anchor="middle" transform="rotate(-90 40 203.0)">seconds</text>
<rect class="s1" x="115.0" y="288.0" width="16.0" height="2.0" rx="0"/>
<circle class="s1" cx="143.0" cy="128.1" r="3.5" fill-opacity=".55"/>
<text class="t1" x="143.0" y="120.1" font-size="12" text-anchor="middle">67</text>
<circle class="s1" cx="161.0" cy="289.0" r="3.5" fill-opacity=".55"/>
<text class="t1" x="161.0" y="281.0" font-size="12" text-anchor="middle">9</text>
<circle class="s1" cx="179.0" cy="294.6" r="3.5" fill-opacity=".55"/>
<text class="t1" x="179.0" y="286.6" font-size="12" text-anchor="middle">7</text>
<text class="t1" x="161.0" y="332.0" font-size="12" text-anchor="middle">Postgres 18.6</text>
<text class="t2" x="161.0" y="348.0" font-size="12" text-anchor="middle">default archive</text>
<rect class="s1" x="269.0" y="288.0" width="16.0" height="2.0" rx="0"/>
<circle class="s1" cx="297.0" cy="216.9" r="3.5" fill-opacity=".55"/>
<text class="t1" x="297.0" y="208.9" font-size="12" text-anchor="middle">35</text>
<circle class="s1" cx="315.0" cy="289.0" r="3.5" fill-opacity=".55"/>
<text class="t1" x="315.0" y="281.0" font-size="12" text-anchor="middle">9</text>
<circle class="s1" cx="333.0" cy="297.4" r="3.5" fill-opacity=".55"/>
<text class="t1" x="333.0" y="289.4" font-size="12" text-anchor="middle">6</text>
<text class="t1" x="315.0" y="332.0" font-size="12" text-anchor="middle">Postgres 18.6</text>
<text class="t2" x="315.0" y="348.0" font-size="12" text-anchor="middle">--statistics</text>
<rect class="s2" x="423.0" y="290.8" width="16.0" height="2.0" rx="0"/>
<circle class="s2" cx="451.0" cy="153.1" r="3.5" fill-opacity=".55"/>
<text class="t1" x="451.0" y="145.1" font-size="12" text-anchor="middle">58</text>
<circle class="s2" cx="469.0" cy="291.8" r="3.5" fill-opacity=".55"/>
<text class="t1" x="469.0" y="283.8" font-size="12" text-anchor="middle">8</text>
<circle class="s2" cx="487.0" cy="291.8" r="3.5" fill-opacity=".55"/>
<text class="t1" x="487.0" y="283.8" font-size="12" text-anchor="middle">8</text>
<text class="t1" x="469.0" y="332.0" font-size="12" text-anchor="middle">Postgres 19rc1</text>
<text class="t2" x="469.0" y="348.0" font-size="12" text-anchor="middle">default archive</text>
<rect class="s2" x="577.0" y="285.2" width="16.0" height="2.0" rx="0"/>
<circle class="s2" cx="605.0" cy="250.2" r="3.5" fill-opacity=".55"/>
<text class="t1" x="605.0" y="242.2" font-size="12" text-anchor="middle">23</text>
<circle class="s2" cx="623.0" cy="286.2" r="3.5" fill-opacity=".55"/>
<text class="t1" x="623.0" y="278.2" font-size="12" text-anchor="middle">10</text>
<circle class="s2" cx="641.0" cy="297.4" r="3.5" fill-opacity=".55"/>
<text class="t1" x="641.0" y="289.4" font-size="12" text-anchor="middle">6</text>
<text class="t1" x="623.0" y="332.0" font-size="12" text-anchor="middle">Postgres 19rc1</text>
<text class="t2" x="623.0" y="348.0" font-size="12" text-anchor="middle">--statistics</text>
<text class="t2" x="40.0" y="380.0" font-size="12">Stock autovacuum settings, idle cluster, 63 MiB fixture. Restores 1, 2 and 3 are plotted left to right.</text>
<text class="t2" x="40.0" y="398.0" font-size="12">This is completion for all three tables, not when each query first improved.</text>
</svg>
