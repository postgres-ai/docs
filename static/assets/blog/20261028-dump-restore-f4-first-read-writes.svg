<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 534" width="760" height="534" role="img" aria-labelledby="t d">
<title id="t">The first read after pg_restore can write</title>
<desc id="d">Postgres 18.6, checksums on: count(*), index-less table, after checkpoint 26.9 MiB WAL, 3,449 shared blocks dirtied; count(*), index-less table, no checkpoint 0.0 MiB WAL, 1,432 shared blocks dirtied; Range query, indexed table, after checkpoint 0.0 MiB WAL, 0 shared blocks dirtied; count(*), indexed table, right after the range query 0.0 MiB WAL, 0 shared blocks dirtied; count(*), index-less table, after VACUUM 0.0 MiB WAL, 0 shared blocks dirtied. Postgres 19rc1, checksums on: count(*), index-less table, after checkpoint 27.1 MiB WAL, 3,450 shared blocks dirtied; count(*), index-less table, no checkpoint 0.2 MiB WAL, 1,433 shared blocks dirtied; Range query, indexed table, after checkpoint 25.6 MiB WAL, 3,268 shared blocks dirtied; count(*), indexed table, right after the range query 1.4 MiB WAL, 181 shared blocks dirtied; count(*), index-less table, after VACUUM 0.0 MiB WAL, 0 shared blocks dirtied. On Postgres 19rc1 the range query sets 3,267 of 3,480 visibility-map bits.</desc>
<style>
  .bg{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.grid{stroke:#e4e3df}.axis{stroke:#9a9993}
  .s1{fill:#2a78d6}.s2{fill:#eb6834}.band{fill:#eb6834;opacity:.08}.gap{stroke:#fcfcfb}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
</style>
