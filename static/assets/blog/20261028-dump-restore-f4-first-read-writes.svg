<text class="t1" x="569.4" y="194.5" font-size="12">1,432</text>
<rect class="s2" x="500.0" y="200.0" width="64.5" height="13.0" rx="2"/>
<text class="t1" x="569.5" y="210.5" font-size="12">1,433</text>
<text class="t1" x="505.0" y="248.5" font-size="12">0</text>
<rect class="s2" x="500.0" y="254.0" width="147.1" height="13.0" rx="2"/>
<text class="t1" x="652.1" y="264.5" font-size="12">3,268</text>
<text class="t1" x="505.0" y="302.5" font-size="12">0</text>
<rect class="s2" x="500.0" y="308.0" width="8.1" height="13.0" rx="2"/>
<text class="t1" x="513.1" y="318.5" font-size="12">181</text>
<text class="t1" x="505.0" y="356.5" font-size="12">0</text>
<text class="t1" x="505.0" y="372.5" font-size="12">0</text>
<text class="t2" x="730.0" y="281.0" font-size="11" text-anchor="end">sets 3,267 of 3,480 visibility-map bits</text>
<text class="t1" x="40.0" y="138.0" font-size="12">count(*), index-less table,</text>
<text class="t2" x="40.0" y="153.0" font-size="12">after checkpoint</text>
<text class="t1" x="40.0" y="192.0" font-size="12">count(*), index-less table,</text>
<text class="t2" x="40.0" y="207.0" font-size="12">no checkpoint</text>
<text class="t1" x="40.0" y="246.0" font-size="12">Range query, indexed table,</text>
<text class="t2" x="40.0" y="261.0" font-size="12">after checkpoint</text>
<text class="t1" x="40.0" y="300.0" font-size="12">count(*), indexed table,</text>
<text class="t2" x="40.0" y="315.0" font-size="12">right after the range query</text>
<text class="t1" x="40.0" y="354.0" font-size="12">count(*), index-less table,</text>
<text class="t2" x="40.0" y="369.0" font-size="12">after VACUUM</text>
<text class="t2" x="40.0" y="446.0" font-size="12">Small test, extended small fixture (the 63 MiB base plus an unindexed 200,000-row table), 200,000-row tables,</text>
<text class="t2" x="40.0" y="464.0" font-size="12">3 fresh pg_restore runs per scenario with identical results.</text>
<text class="t2" x="40.0" y="482.0" font-size="12">After a checkpoint, the first change to a page needs a full-page image (checksums on);</text>
<text class="t2" x="40.0" y="500.0" font-size="12">indexed tables already had hint bits set by CREATE INDEX during pg_restore.</text>
<text class="t2" x="40.0" y="518.0" font-size="12">With checksums off, Postgres 18.6 dirtied the same blocks and wrote no WAL in every scenario.</text>
</svg>
