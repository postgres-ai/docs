<line class="grid" x1="500.0" x2="500.0" y1="122.0" y2="386.0" stroke-width="1"/>
<text class="t2" x="500.0" y="401.0" font-size="11" text-anchor="middle">0</text>
<line class="grid" x1="590.0" x2="590.0" y1="122.0" y2="386.0" stroke-width="1"/>
