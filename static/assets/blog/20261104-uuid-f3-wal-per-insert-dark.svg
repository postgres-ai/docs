<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 306" width="760" height="306" role="img" aria-labelledby="t d">
<title id="t">WAL per insert: UUIDv4 pays full-page images after every checkpoint</title>
<desc id="d">Left: run 1, each key on its own server, rows 80M to 100M, WAL bytes per insert: UUIDv4 1,324 (145 full-page images per 1,000 inserts), UUIDv7 744 (40), int8 745 (42). Right: WAL bytes per insert in the first 30 s and the last 60 s of a 300 s checkpoint cycle, mean over cycles 10 to 19 (UUIDv4) and 10 to 16 (UUIDv7, int8): UUIDv4 3,871 and 497 B; UUIDv7 835 and 428 B; int8 1,507 and 566 B.</desc>
<style>
  .bg{fill:#202124}.t1{fill:#ececea}.t2{fill:#a8a7a1}.grid{stroke:#34363b}.axis{stroke:#6d6c68}.mark{stroke:#85847e}
  .f-v4{fill:#e5683d}.s-v4{stroke:#e5683d}
  .f-v7{fill:#3987e5}.s-v7{stroke:#3987e5}
  .f-int8{fill:#b85ab4}.s-int8{stroke:#b85ab4}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
</style>
<rect class="bg" width="760" height="306" rx="8"/>
<text class="t1" x="40.0" y="34.0" font-size="12" font-weight="600">WAL per insert, rows 80M to 100M</text>
<line class="grid" x1="84.0" x2="300.0" y1="230.0" y2="230.0" stroke-width="1"/>
