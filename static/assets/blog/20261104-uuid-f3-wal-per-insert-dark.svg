<text class="t2" x="78.0" y="127.3" font-size="11" text-anchor="end">1,000</text>
<line class="grid" x1="84.0" x2="300.0" y1="70.0" y2="70.0" stroke-width="1"/>
<text class="t2" x="78.0" y="74.0" font-size="11" text-anchor="end">1,500</text>
<rect class="f-v4" x="98.4" y="88.8" width="43.2" height="141.2" rx="2"/>
<text class="t1" x="120.0" y="80.8" font-size="12" text-anchor="middle">1,324 B</text>
<text class="t1" x="120.0" y="246.0" font-size="12" text-anchor="middle">UUIDv4</text>
<text class="t2" x="120.0" y="262.0" font-size="10" text-anchor="middle">145 FPI/1k</text>
<rect class="f-v7" x="170.4" y="150.6" width="43.2" height="79.4" rx="2"/>
<text class="t1" x="192.0" y="142.6" font-size="12" text-anchor="middle">744 B</text>
<text class="t1" x="192.0" y="246.0" font-size="12" text-anchor="middle">UUIDv7</text>
<text class="t2" x="192.0" y="262.0" font-size="10" text-anchor="middle">40 FPI/1k</text>
<rect class="f-int8" x="242.4" y="150.5" width="43.2" height="79.5" rx="2"/>
<text class="t1" x="264.0" y="142.5" font-size="12" text-anchor="middle">745 B</text>
<text class="t1" x="264.0" y="246.0" font-size="12" text-anchor="middle">int8</text>
<text class="t2" x="264.0" y="262.0" font-size="10" text-anchor="middle">42 FPI/1k</text>
<line class="axis" x1="84.0" x2="300.0" y1="230.0" y2="230.0" stroke-width="1"/>
