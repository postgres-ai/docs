<circle class="dot" cx="81.9" cy="217.0" r="2.5"/>
<circle class="dot" cx="77.6" cy="217.0" r="2.5"/>
<circle class="dot" cx="83.2" cy="217.0" r="2.5"/>
<text class="t1" x="24" y="238" font-size="13">+ VACUUM ANALYZE</text>
<text class="t1" x="356" y="238" font-size="14" font-weight="600" text-anchor="end">23 ms</text>
<text class="t2" x="24" y="254" font-size="11">Index Only Scan, 0 heap fetches</text>
<rect class="s1" x="24.0" y="262" width="0.22" height="20"/>
<circle class="dot" cx="24.3" cy="287.0" r="2.5"/>
<circle class="dot" cx="24.3" cy="287.0" r="2.5"/>
<circle class="dot" cx="24.3" cy="287.0" r="2.5"/>
<circle class="dot" cx="24.3" cy="287.0" r="2.5"/>
<circle class="dot" cx="24.3" cy="287.0" r="2.5"/>
<circle class="dot" cx="24.3" cy="287.0" r="2.5"/>
<circle class="dot" cx="24.3" cy="287.0" r="2.5"/>
<circle class="dot" cx="24.3" cy="287.0" r="2.5"/>
<circle class="dot" cx="24.3" cy="287.0" r="2.5"/>
<text class="t1" x="34.0" y="277" font-size="12" font-weight="600">about 1,400× faster</text>
<text class="t2" x="24" y="320" font-size="11">Execution time, cold cache, seconds (linear, from 0)</text>
<text class="t2" x="24" y="340" font-size="11">250 M-row table, 31 GiB heap, 16 GiB RAM, OS cache</text>
<text class="t2" x="24" y="356" font-size="11">dropped before each run; 9 runs per step.</text>
</svg>
