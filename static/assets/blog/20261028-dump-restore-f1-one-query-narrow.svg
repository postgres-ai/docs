<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 374" width="380" height="374" role="img" aria-labelledby="t d">
<title id="t">One query after a logical restore, Postgres 18.6</title>
<desc id="d">Cold-cache execution time of one join query over a 250 M-row table, linear scale from 0 s. Each bar is the median of 9 runs, each dot is one run. pg_restore only: median 32.6 s, Seq Scan, Hash Join; + ANALYZE: median 6.1 s, Index Only Scan, 24,983 heap fetches; + VACUUM ANALYZE: median 23 ms, Index Only Scan, 0 heap fetches, about 1,400 times faster than pg_restore only.</desc>

<style>
  .bg{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.grid{stroke:#e4e3df}.axis{stroke:#9a9993}
  .s1{fill:#2a78d6}.s2{fill:#eb6834}.band{fill:#eb6834;opacity:.08}.gap{stroke:#fcfcfb}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.dot{fill:#ffffff;stroke:#0b3d7a;stroke-width:1.25}
</style>
<rect class="bg" width="380" height="374" rx="8"/>
<text class="t1" x="24" y="30" font-size="15" font-weight="600">One query after a logical restore,</text>
<text class="t1" x="24" y="49" font-size="15" font-weight="600">Postgres 18.6</text>
<text class="t2" x="24" y="69" font-size="12">Bar: median of 9 cold-cache runs. Dot: one run.</text>
<line class="grid" x1="24.0" x2="24.0" y1="119" y2="145" stroke-width="1"/>
<line class="grid" x1="24.0" x2="24.0" y1="189" y2="215" stroke-width="1"/>
<line class="grid" x1="24.0" x2="24.0" y1="259" y2="284" stroke-width="1"/>
<text class="t2" x="24.0" y="300" font-size="11" text-anchor="middle">0 s</text>
<line class="grid" x1="118.9" x2="118.9" y1="119" y2="145" stroke-width="1"/>
<line class="grid" x1="118.9" x2="118.9" y1="189" y2="215" stroke-width="1"/>
<line class="grid" x1="118.9" x2="118.9" y1="259" y2="284" stroke-width="1"/>
<text class="t2" x="118.9" y="300" font-size="11" text-anchor="middle">10 s</text>
<line class="grid" x1="213.7" x2="213.7" y1="119" y2="145" stroke-width="1"/>
<line class="grid" x1="213.7" x2="213.7" y1="189" y2="215" stroke-width="1"/>
<line class="grid" x1="213.7" x2="213.7" y1="259" y2="284" stroke-width="1"/>
<text class="t2" x="213.7" y="300" font-size="11" text-anchor="middle">20 s</text>
<line class="grid" x1="308.6" x2="308.6" y1="119" y2="145" stroke-width="1"/>
<line class="grid" x1="308.6" x2="308.6" y1="189" y2="215" stroke-width="1"/>
<line class="grid" x1="308.6" x2="308.6" y1="259" y2="284" stroke-width="1"/>
<text class="t2" x="308.6" y="300" font-size="11" text-anchor="middle">30 s</text>
<line class="axis" x1="24.0" x2="356.0" y1="284" y2="284" stroke-width="1"/>
<text class="t1" x="24" y="98" font-size="13">pg_restore only</text>
<text class="t1" x="356" y="98" font-size="14" font-weight="600" text-anchor="end">32.6 s</text>
<text class="t2" x="24" y="114" font-size="11">Seq Scan, Hash Join</text>
<rect class="s1" x="24.0" y="122" width="309.40" height="20"/>
<circle class="dot" cx="331.7" cy="147.0" r="2.5"/>
<circle class="dot" cx="335.1" cy="147.0" r="2.5"/>
<circle class="dot" cx="331.7" cy="147.0" r="2.5"/>
<circle class="dot" cx="333.3" cy="147.0" r="2.5"/>
<circle class="dot" cx="331.5" cy="147.0" r="2.5"/>
<circle class="dot" cx="333.9" cy="147.0" r="2.5"/>
<circle class="dot" cx="338.9" cy="147.0" r="2.5"/>
<circle class="dot" cx="336.6" cy="147.0" r="2.5"/>
<circle class="dot" cx="331.8" cy="147.0" r="2.5"/>
<text class="t1" x="24" y="168" font-size="13">+ ANALYZE</text>
<text class="t1" x="356" y="168" font-size="14" font-weight="600" text-anchor="end">6.1 s</text>
<text class="t2" x="24" y="184" font-size="11">Index Only Scan, 24,983 heap fetches</text>
<rect class="s1" x="24.0" y="192" width="57.91" height="20"/>
