<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 604" width="380" height="604" role="img" aria-labelledby="t d">
<title id="t">Inserts per second as the table grows from 0 to 100M rows</title>
<desc id="d">Run 6, Postgres 18.6, 16 clients, one row per transaction, 2M-row bins. Small tier (1 GiB shared_buffers, 3 GiB memory cap): int8 ends at 23.5k inserts/s (one server), UUIDv7 at 21.7k (mean of two servers), UUIDv4 at 13.9k (mean of three servers). Mid tier (2 GiB shared_buffers, no cap): UUIDv7 ends at 20.9k, UUIDv4 at 18.3k. UUIDv4 starts to fall at about 26M rows on the small tier.</desc>
