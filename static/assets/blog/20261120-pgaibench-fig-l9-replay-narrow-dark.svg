<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 508" width="360" height="508" role="img" aria-label="Why primary dashboards mislead (live Postgres 18.7 trace): after Grok 4.7 dropped all three indexes on secret_lookup (two on k and one on v, at 54s, 75s, and 99s), primary median throughput rose +16% (2625 to 3040 TPS, 0 SQL errors, 12 ms max lock wait; secret_lookup receives no primary writes) and pooled workload p99 rose only 1.19x, while async standby query q20 client p99 slowed 18.0x (2.91 to 52.58 ms; server mean exec 0.0214 to 4.03 ms, 188x)." style="font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Inter,sans-serif;">
