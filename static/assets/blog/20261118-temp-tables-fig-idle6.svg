<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="t d">
<title id="t">Temp-table transactions per second against idle sessions, target 500</title>
<desc id="d">Postgres 18.6, 16 vCPU, 16 DDL clients running CREATE TEMP TABLE with ON COMMIT DROP at a 500 TPS target, one run per point, nothing was measured between the points (dashed lines). 0 idle: 502 TPS, LWLock:SInvalWrite 1.3% of the DDL sessions' active samples. 1000 idle: 502 TPS, 54%. 3000 idle: 274 TPS, 86%. 5000 idle: 127 TPS, 91%. A second run at 5000 idle on another server: 249 TPS (hollow marker).</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}</style>
<rect width="760" height="420" rx="10" fill="#fcfcfb"/>
<line x1="40" y1="340" x2="700" y2="340" stroke="#8a8984" stroke-width="1"/>
<line x1="40" y1="98.9" x2="700" y2="98.9" stroke="#8a8984" stroke-width="1" stroke-dasharray="4 5"/>
<text x="700" y="121.9" font-size="17" fill="#5f5f5a" text-anchor="end">target 500</text>
<text x="40" y="365" font-size="17" fill="#5f5f5a">0</text>
<text x="172" y="365" font-size="17" fill="#5f5f5a" text-anchor="middle">1000</text>
<text x="436" y="365" font-size="17" fill="#5f5f5a" text-anchor="middle">3000</text>
<text x="700" y="365" font-size="17" fill="#5f5f5a" text-anchor="end">5000</text>
<text x="700" y="390" font-size="17" fill="#5f5f5a" text-anchor="end">idle sessions</text>
<line x1="40" y1="98" x2="172" y2="98" stroke="#141414" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="172" y1="98" x2="436" y2="207.9" stroke="#141414" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="436" y1="207.9" x2="700" y2="278.8" stroke="#141414" stroke-width="2" stroke-dasharray="6 5"/>
<circle cx="40" cy="98" r="5" fill="#141414"/>
<circle cx="172" cy="98" r="5" fill="#141414"/>
<circle cx="436" cy="207.9" r="5" fill="#141414"/>
<circle cx="700" cy="278.8" r="5" fill="#141414"/>
<circle cx="700" cy="219.9" r="5.5" fill="#fcfcfb" stroke="#141414" stroke-width="1.8"/>
<text x="40" y="58" font-size="18" fill="#141414" font-weight="700">502 TPS</text>
<text x="40" y="81" font-size="17" fill="#c4470a" font-weight="600">SInvalWrite 1.3%</text>
<text x="212" y="58" font-size="18" fill="#141414" font-weight="700">502 TPS</text>
<text x="212" y="81" font-size="17" fill="#c4470a" font-weight="600">SInvalWrite 54%</text>
<text x="424" y="237.9" font-size="18" fill="#141414" font-weight="700" text-anchor="end">274 TPS</text>
<text x="424" y="260.9" font-size="17" fill="#c4470a" font-weight="600" text-anchor="end">SInvalWrite 86%</text>
<text x="686" y="308.8" font-size="18" fill="#141414" font-weight="700" text-anchor="end">127 TPS</text>
<text x="686" y="331.8" font-size="17" fill="#c4470a" font-weight="600" text-anchor="end">SInvalWrite 91%</text>
<text x="705" y="203.9" font-size="17" fill="#5f5f5a" text-anchor="end">second run: 249</text>
</svg>
