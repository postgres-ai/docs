<text class="t2" x="260.6" y="180.0" font-size="11" text-anchor="middle">200</text>
<line class="grid" x1="371.2" x2="371.2" y1="24.0" y2="164.0" stroke-width="1"/>
<text class="t2" x="371.2" y="180.0" font-size="11" text-anchor="middle">400</text>
<line class="grid" x1="481.8" x2="481.8" y1="24.0" y2="164.0" stroke-width="1"/>
<text class="t2" x="481.8" y="180.0" font-size="11" text-anchor="middle">600</text>
<line class="grid" x1="592.4" x2="592.4" y1="24.0" y2="164.0" stroke-width="1"/>
<text class="t2" x="592.4" y="180.0" font-size="11" text-anchor="middle">800</text>
<text class="t2" x="620.0" y="196.0" font-size="11" text-anchor="end">MiB</text>
