<rect class="f-v4" x="150.0" y="30.0" width="424.1" height="26.0" rx="0"/>
<rect class="" x="576.1" y="30.0" width="25.6" height="26.0" rx="0" fill="url(#hatch)"/>
<text class="t1" x="609.8" y="48.0" font-size="12">index 767, table 50 MiB</text>
<text class="t1" x="138.0" y="96.0" font-size="12" text-anchor="end">UUIDv7</text>
<rect class="f-v7" x="150.0" y="78.0" width="49.2" height="26.0" rx="0"/>
