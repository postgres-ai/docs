<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="760" height="230" role="img" aria-labelledby="t d">
<title id="t">What sits in shared_buffers at 100M rows</title>
<desc id="d">Run 1, 1 GiB shared_buffers, 100M rows. UUIDv4: 767 MiB of the primary key index and 50 MiB of the table. UUIDv7: 89 MiB of the index and 475 MiB of the table. int8: 69 MiB of the index and 485 MiB of the table.</desc>
<style>
  .bg{fill:#202124}.t1{fill:#ececea}.t2{fill:#a8a7a1}.grid{stroke:#34363b}.axis{stroke:#6d6c68}.mark{stroke:#85847e}
  .f-v4{fill:#e5683d}.s-v4{stroke:#e5683d}
  .f-v7{fill:#3987e5}.s-v7{stroke:#3987e5}
  .f-int8{fill:#b85ab4}.s-int8{stroke:#b85ab4}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
</style>
<rect class="bg" width="760" height="230" rx="8"/>
<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#202124"/><line x1="0" y1="0" x2="0" y2="6" stroke="#85847e" stroke-width="2"/></pattern></defs>
<line class="grid" x1="150.0" x2="150.0" y1="24.0" y2="164.0" stroke-width="1"/>
