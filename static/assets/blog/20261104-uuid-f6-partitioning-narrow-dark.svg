<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 380" width="380" height="380" role="img" aria-labelledby="t d">
<title id="t">Point lookups by id, 100 partitions: partition by what you look up by</title>
<desc id="d">Run 1x, 50M rows, 100 partitions, 16 clients, 8 vCPUs, literal id lookups per second: UUIDv4 partitioned by RANGE on created_at 2,614; UUIDv7 partitioned by RANGE on uuid_extract_timestamp(id) 2,863; UUIDv7 partitioned by RANGE on id 41,136; int8 partitioned by RANGE on id 41,008.</desc>
<style>
  .bg{fill:#202124}.t1{fill:#ececea}.t2{fill:#a8a7a1}.grid{stroke:#34363b}.axis{stroke:#6d6c68}.mark{stroke:#85847e}
  .f-v4{fill:#e5683d}.s-v4{stroke:#e5683d}
  .f-v7{fill:#3987e5}.s-v7{stroke:#3987e5}
  .f-int8{fill:#b85ab4}.s-int8{stroke:#b85ab4}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
</style>
<rect class="bg" width="380" height="380" rx="8"/>
<line class="grid" x1="16.0" x2="16.0" y1="28.0" y2="322.0" stroke-width="1"/>
<text class="t2" x="16.0" y="338.0" font-size="12" text-anchor="middle">0</text>
<line class="grid" x1="93.3" x2="93.3" y1="28.0" y2="322.0" stroke-width="1"/>
<text class="t2" x="93.3" y="338.0" font-size="12" text-anchor="middle">10k</text>
<line class="grid" x1="170.7" x2="170.7" y1="28.0" y2="322.0" stroke-width="1"/>
<text class="t2" x="170.7" y="338.0" font-size="12" text-anchor="middle">20k</text>
<line class="grid" x1="248.0" x2="248.0" y1="28.0" y2="322.0" stroke-width="1"/>
<text class="t2" x="248.0" y="338.0" font-size="12" text-anchor="middle">30k</text>
<line class="grid" x1="325.3" x2="325.3" y1="28.0" y2="322.0" stroke-width="1"/>
<text class="t2" x="325.3" y="338.0" font-size="12" text-anchor="end">40k</text>
<text class="t2" x="364.0" y="354.0" font-size="12" text-anchor="end">lookups/s</text>
<line class="axis" x1="16.0" x2="16.0" y1="28.0" y2="322.0" stroke-width="1"/>
<text class="t1" x="16.0" y="47.0" font-size="13" font-weight="600">UUIDv4, RANGE on created_at</text>
<text class="t1" x="364.0" y="47.0" font-size="13" text-anchor="end">2,614</text>
<text class="t2" x="16.0" y="64.0" font-size="12">scans every partition</text>
<rect class="f-v4" x="16.0" y="74.0" width="20.2" height="18.0" rx="2"/>
<text class="t1" x="16.0" y="121.0" font-size="13" font-weight="600">UUIDv7, RANGE on timestamp of id</text>
<text class="t1" x="364.0" y="121.0" font-size="13" text-anchor="end">2,863</text>
<text class="t2" x="16.0" y="138.0" font-size="12">scans every partition</text>
<rect class="f-v7" x="16.0" y="148.0" width="22.1" height="18.0" rx="2"/>
<text class="t1" x="16.0" y="195.0" font-size="13" font-weight="600">UUIDv7, RANGE on id</text>
<text class="t1" x="364.0" y="195.0" font-size="13" text-anchor="end">41,136</text>
<text class="t2" x="16.0" y="212.0" font-size="12">prunes to one</text>
<rect class="f-v7" x="16.0" y="222.0" width="318.1" height="18.0" rx="2"/>
<text class="t1" x="16.0" y="269.0" font-size="13" font-weight="600">int8, RANGE on id</text>
<text class="t1" x="364.0" y="269.0" font-size="13" text-anchor="end">41,008</text>
<text class="t2" x="16.0" y="286.0" font-size="12">prunes to one</text>
<rect class="f-int8" x="16.0" y="296.0" width="317.1" height="18.0" rx="2"/>
</svg>
