<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 596" width="760" height="596" role="img" aria-labelledby="t d">
<title id="t">AAA: three roles, and the path of one change request</title>
<desc id="d">AAA: Analyst, Auditor, Actor, and the path of one change request in two phases. Phase 1, prepare and test: the Analyst is the most capable model, and it is not trusted. It observes production, and its budget is hours. It finds root causes, and it writes and tests change requests. It gives a draft change to the Actor. The Actor has almost no AI: it runs the exact steps and logs them, and a fast risk check can abort and revert. The Actor rehearses the draft on a clone of production, and the test results go back to the Analyst, who can repeat this. Phase 2, review and apply: the Analyst sends the change request with the test evidence to the Auditor, a small model tuned to detect harm, with a budget of minutes. The Auditor reviews change requests, and it checks production after a change. It decides: approve, send back to the Analyst, or reject. After an approval the Actor applies the same steps to production Postgres. Only the Actor changes production.</desc>
