<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 358 260" width="358" height="260" role="img" aria-labelledby="t d">
<title id="t">Where all sessions spend their active time, with 0 and with 5000 idle sessions</title>
<desc id="d">Postgres 18.6, 16 vCPU, 500 temp-table TPS target, second runs at 0 and 5000 idle sessions on another server (DDL achieved 501 and 249 TPS), all sessions sampled with pg_wait_sampling, Client and Activity waits left out. 0 idle sessions: CPU* 95.0%, LWLock 3.1%, IO 1.8%. 5000 idle sessions: LWLock:SInvalWrite 84.7%, other LWLock 3.4%, CPU* 11.7%, IO 0.13%.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}</style>
<rect width="358" height="260" rx="10" fill="#fcfcfb"/>
<text x="14" y="28" font-size="14" fill="#141414" font-weight="700">0 idle sessions</text>
<rect x="14" y="38" width="313.5" height="30" fill="#73BF69"/>
<text x="24" y="58" font-size="14" fill="#141414" font-weight="600">CPU* 95.0%</text>
<rect x="327.5" y="38" width="10.2" height="30" fill="#C4162A"/>
<line x1="327.5" y1="38" x2="327.5" y2="68" stroke="#fcfcfb" stroke-width="1.5"/>
<rect x="337.7" y="38" width="5.9" height="30" fill="#5794F2"/>
<line x1="337.7" y1="38" x2="337.7" y2="68" stroke="#fcfcfb" stroke-width="1.5"/>
<text x="344" y="88" font-size="14" fill="#5f5f5a" text-anchor="end">LWLock 3.1%, IO 1.8%</text>
<text x="14" y="130" font-size="14" fill="#141414" font-weight="700">5000 idle sessions</text>
<rect x="14" y="140" width="279.5" height="30" fill="#C4162A"/>
<text x="24" y="160" font-size="14" fill="#ffffff" font-weight="600">LWLock:SInvalWrite 84.7%</text>
<rect x="293.5" y="140" width="11.2" height="30" fill="#C4162A"/>
<line x1="293.5" y1="140" x2="293.5" y2="170" stroke="#fcfcfb" stroke-width="1.5"/>
<rect x="304.7" y="140" width="38.6" height="30" fill="#73BF69"/>
<line x1="304.7" y1="140" x2="304.7" y2="170" stroke="#fcfcfb" stroke-width="1.5"/>
<rect x="343.3" y="140" width="1" height="30" fill="#5794F2"/>
<line x1="343.3" y1="140" x2="343.3" y2="170" stroke="#fcfcfb" stroke-width="1.5"/>
<text x="344" y="190" font-size="14" fill="#5f5f5a" text-anchor="end">other LWLock 3.4%, CPU* 11.7%, IO 0.13%</text>
<text x="14" y="228" font-size="14" fill="#5f5f5a">share of active-session samples, all sessions</text>
<text x="14" y="248" font-size="14" fill="#5f5f5a">CPU* = no wait event reported</text>
</svg>
