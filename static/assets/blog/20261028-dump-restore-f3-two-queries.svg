<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 488" width="760" height="488" role="img" aria-labelledby="t d">
<title id="t">Two queries, two fixes: ANALYZE changes the join, VACUUM changes the index-only read</title>
<desc id="d">Postgres 18.6, root shared buffer accesses of the natural plan. Skewed join: none 396,608 (Nested Loop), ANALYZE 2,096 (Hash Join), VACUUM 396,608 (Nested Loop), VACUUM ANALYZE 2,096 (Hash Join), --statistics archive, none 2,096 (Hash Join). Covering range query: none 3,301 (Bitmap Heap Scan), ANALYZE 3,301 (Bitmap Heap Scan), VACUUM 34 (Index Only Scan), VACUUM ANALYZE 34 (Index Only Scan), --statistics archive, none 3,301 (Bitmap Heap Scan).</desc>
<style>
  .bg{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.grid{stroke:#e4e3df}.axis{stroke:#9a9993}
  .s1{fill:#2a78d6}.s2{fill:#eb6834}.band{fill:#eb6834;opacity:.08}.gap{stroke:#fcfcfb}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
</style>
