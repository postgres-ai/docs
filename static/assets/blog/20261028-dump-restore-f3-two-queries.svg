<text class="t1" x="40.0" y="130.0" font-size="12">none</text>
<text class="t1" x="40.0" y="176.0" font-size="12">ANALYZE</text>
<text class="t1" x="40.0" y="222.0" font-size="12">VACUUM</text>
<text class="t1" x="40.0" y="268.0" font-size="12">VACUUM ANALYZE</text>
<text class="t1" x="40.0" y="314.0" font-size="12">--statistics archive, none</text>
<text class="t2" x="40.0" y="400.0" font-size="12">63 MiB fixture, warm cache, 3 fresh restores × 3 measured passes; buffer accesses are the evidence, not milliseconds.</text>
<text class="t2" x="40.0" y="418.0" font-size="12">For illustration, warm-cache median execution time: join 145 ms with no maintenance, 67 ms after ANALYZE;</text>
<text class="t2" x="40.0" y="436.0" font-size="12">range query 6.6 ms with no maintenance, 1.1 ms after VACUUM.</text>
<text class="t2" x="40.0" y="454.0" font-size="12">Autovacuum on in this track: CREATE INDEX reset the imported relallvisible to 0, so the --statistics arm kept the</text>
<text class="t2" x="40.0" y="472.0" font-size="12">Bitmap Heap Scan; figure 2 shows the same archive with autovacuum off.</text>
</svg>
