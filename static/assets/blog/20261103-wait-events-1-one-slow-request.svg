<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="t d">
<title id="t">Anatomy of one slow checkout request</title>
<desc id="d">Timeline of a 12.63 ms request: BEGIN, a 0.27 ms disk read for the catalog lookup, then 10.97 ms waiting on Lock:transactionid inside UPDATE stock, then 0.53 ms of WAL write and fsync at COMMIT. A 10 ms sampler would catch it in at most one sample.</desc>
<style>
.bg{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.grid{stroke:#e4e3df}.axis{stroke:#9a9993}.gap{stroke:#fcfcfb}
.s1{fill:#2a78d6}.s2{fill:#eb6834}.s3{fill:#1baf7a}.s4{fill:#eda100}.s5{fill:#4a3aa7}.n{fill:#c7c6c1}
.l1{stroke:#2a78d6}.l2{stroke:#eb6834}.l3{stroke:#1baf7a}.l4{stroke:#eda100}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){.bg{fill:#1a1a19}.t1{fill:#fff}.t2{fill:#c3c2b7}.grid{stroke:#383835}.axis{stroke:#6f6e69}.gap{stroke:#1a1a19}
.s1{fill:#3987e5}.s2{fill:#d95926}.s3{fill:#199e70}.s4{fill:#c98500}.s5{fill:#9085e9}.n{fill:#55544f}
.l1{stroke:#3987e5}.l2{stroke:#d95926}.l3{stroke:#199e70}.l4{stroke:#c98500}}
</style>
<rect class="bg" width="760" height="300" rx="8"/>
<text class="t1" x="40" y="28" font-size="15" font-weight="600">One slow checkout, 12.63 ms, rebuilt from its own waits</text>
<text class="t1" x="80" y="106" font-size="12" text-anchor="end" font-weight="600">waits</text>
<line class="axis" x1="90" x2="730" y1="114" y2="114" stroke-width="1"/>
<rect class="s5" x="91.5" y="90" width="11.1" height="24" rx="2"/>
<rect class="s4" x="105.4" y="90" width="13.1" height="24" rx="2"/>
<rect class="s5" x="120.0" y="90" width="5.2" height="24" rx="2"/>
<rect class="s2" x="131.1" y="90" width="539.9" height="24" rx="2"/>
<rect class="s5" x="675.1" y="90" width="8.2" height="24" rx="2"/>
<rect class="s1" x="684.6" y="90" width="5.3" height="24" rx="2"/>
<rect class="s1" x="690.0" y="90" width="1.5" height="24" rx="2"/>
<rect class="s1" x="690.7" y="90" width="19.9" height="24" rx="2"/>
<text class="t1" x="80" y="154" font-size="12" text-anchor="end" font-weight="600">statement</text>
<rect class="n" x="90.0" y="140" width="2.0" height="18" rx="2"/>
<rect class="n" x="103.5" y="140" width="22.4" height="18" rx="2"/>
<rect class="n" x="126.4" y="140" width="547.5" height="18" rx="2"/>
<text class="t1" x="400.1" y="153" font-size="11" text-anchor="middle">UPDATE stock</text>
<rect class="n" x="684.2" y="140" width="27.6" height="18" rx="2"/>
<text class="t2" x="90.0" y="172" font-size="10" text-anchor="start">BEGIN · SELECT</text>
<text class="t2" x="695.5" y="172" font-size="10" text-anchor="middle">COMMIT</text>
<text class="t1" x="400.2" y="106" font-size="12" text-anchor="middle" fill="#fff">Lock:transactionid · 10.97 ms</text>
<text class="t1" x="80" y="204" font-size="12" text-anchor="end" font-weight="600">10 ms sampler</text>
<line class="axis" x1="272.2" x2="272.2" y1="84" y2="206" stroke-width="1.5" stroke-dasharray="3 3"/>
<circle class="s2" cx="272.2" cy="200" r="4"/>
<text class="t2" x="280.2" y="204" font-size="11">one sample, if its tick lands here; a 1 s sampler almost never looks</text>
<text class="t2" x="90.0" y="130" font-size="11" text-anchor="middle">0 ms</text>
<text class="t2" x="188.5" y="130" font-size="11" text-anchor="middle">2 ms</text>
<text class="t2" x="286.9" y="130" font-size="11" text-anchor="middle">4 ms</text>
<text class="t2" x="385.4" y="130" font-size="11" text-anchor="middle">6 ms</text>
<text class="t2" x="483.8" y="130" font-size="11" text-anchor="middle">8 ms</text>
<text class="t2" x="582.3" y="130" font-size="11" text-anchor="middle">10 ms</text>
<text class="t2" x="680.8" y="130" font-size="11" text-anchor="middle">12 ms</text>
<rect class="s5" x="40" y="250" width="12" height="12"/><text class="t1" x="58" y="261" font-size="11">client round trip</text>
<rect class="s4" x="215" y="250" width="12" height="12"/><text class="t1" x="233" y="261" font-size="11">disk read 0.27 ms</text>
<rect class="s2" x="390" y="250" width="12" height="12"/><text class="t1" x="408" y="261" font-size="11">row lock 10.97 ms</text>
<rect class="s1" x="565" y="250" width="12" height="12"/><text class="t1" x="583" y="261" font-size="11">WAL write + fsync 0.53 ms</text>
<text class="t2" x="40" y="286" font-size="11">Backend 32748, patch run R1b. The request waited 87% of its life for a row lock held by the background job.</text>
</svg>