<rect class="s1" x="90" y="206" width="14" height="4"/><text class="t1" x="110" y="211" font-size="11">baseline</text>
<rect class="s2" x="90" y="226" width="14" height="4"/><text class="t1" x="110" y="231" font-size="11">fix A: synchronous_commit = off</text>
<rect class="s4" x="90" y="246" width="14" height="4"/><text class="t1" x="110" y="251" font-size="11">fix B: 2 GB cache, no disk reads</text>
