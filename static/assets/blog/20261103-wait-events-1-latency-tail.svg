<text class="t2" x="70" y="380" font-size="11">Runs R0c, F1a, F1b, F2: 2,000 requests/s, 120 s each, about 240,000 requests per run.</text>
<text class="t2" x="70" y="394" font-size="11">Fixes A and B move the bulk of requests and leave the tail; fix C moves only the tail.</text>
