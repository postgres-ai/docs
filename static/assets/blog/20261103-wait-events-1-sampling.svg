<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d">
<title id="t">What a 10 ms sampler sees of one second of waits</title>
<desc id="d">A one-second timeline with 6 I/O waits of 30 ms and 24 lock waits of 2 ms. A sampler looking every 10 ms records 18 I/O samples and 6 lock samples: the shares are about right, but it saw only 6 of the 24 lock waits and cannot report counts or durations.</desc>
<style>
.bg{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.grid{stroke:#e4e3df}.axis{stroke:#9a9993}.gap{stroke:#fcfcfb}
.s1{fill:#2a78d6}.s2{fill:#eb6834}.s3{fill:#1baf7a}.s4{fill:#eda100}.s5{fill:#4a3aa7}.n{fill:#c7c6c1}.ann{stroke:#52514e}
.l1{stroke:#2a78d6}.l2{stroke:#eb6834}.l3{stroke:#1baf7a}.l4{stroke:#eda100}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
</style><style>
.dot{opacity:0;animation:ap 0.01s linear forwards}@keyframes ap{to{opacity:1}}
.sweep{animation:sw 10.0s linear forwards}@keyframes sw{to{transform:translateX(520px)}}
.tally{opacity:0;animation:ap 0.4s ease-out forwards;animation-delay:10.3s}
@media (prefers-reduced-motion:reduce){.dot,.tally{opacity:1;animation:none}.sweep{display:none}}
</style>
