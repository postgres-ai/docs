<text class="t2" x="191.0" y="262.0" font-size="11" text-anchor="middle">40 FPI/1k</text>
<rect class="f-int8" x="255.9" y="150.5" width="55.6" height="79.5" rx="2"/>
<text class="t1" x="283.7" y="142.5" font-size="13" text-anchor="middle">745 B</text>
