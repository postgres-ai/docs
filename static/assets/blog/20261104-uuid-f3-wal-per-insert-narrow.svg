<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 610" width="380" height="610" role="img" aria-labelledby="t d">
<title id="t">WAL per insert: UUIDv4 pays full-page images after every checkpoint</title>
<desc id="d">Left: run 1, each key on its own server, rows 80M to 100M, WAL bytes per insert: UUIDv4 1,324 (145 full-page images per 1,000 inserts), UUIDv7 744 (40), int8 745 (42). Right: WAL bytes per insert in the first 30 s and the last 60 s of a 300 s checkpoint cycle, mean over cycles 10 to 19 (UUIDv4) and 10 to 16 (UUIDv7, int8): UUIDv4 3,871 and 497 B; UUIDv7 835 and 428 B; int8 1,507 and 566 B.</desc>
<style>
  .bg{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.grid{stroke:#e4e3df}.axis{stroke:#9a9993}.mark{stroke:#8a8983}
  .f-v4{fill:#c4471f}.s-v4{stroke:#c4471f}
  .f-v7{fill:#2a78d6}.s-v7{stroke:#2a78d6}
  .f-int8{fill:#a3439f}.s-int8{stroke:#a3439f}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
</style>
<rect class="bg" width="380" height="610" rx="8"/>
<text class="t1" x="16.0" y="34.0" font-size="13" font-weight="600">WAL per insert, rows 80M to 100M</text>
<line class="grid" x1="52.0" x2="330.0" y1="230.0" y2="230.0" stroke-width="1"/>
