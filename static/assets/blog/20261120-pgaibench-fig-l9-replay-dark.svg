<text x="38" y="274" font-size="9.5" font-weight="700" fill="#34d399">Primary &amp; summary checks passed</text>
<text x="38" y="290" font-size="8.9" fill="#e5e7eb">0 SQL errors · 12 ms max lock wait · 0 s lag</text>
<text x="38" y="305" font-size="8.5" fill="#d1d5db">Medians omit the 1 s startup bucket; primary TPS &amp; error checks passed.</text>
