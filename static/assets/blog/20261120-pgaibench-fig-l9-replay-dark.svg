<text x="418" y="56" font-size="10.6" font-weight="700" fill="#f87171">B. Async read replica: query q20 is 18× slower</text>
<text x="418" y="71" font-size="8.9" fill="#9ca3af">p99 latency slowdown vs. baseline (1.0× = unchanged)</text>
<text x="418" y="104" font-size="9.6" font-weight="600" fill="#e5e7eb">Pooled workload p99, all queries (hides break)</text>
